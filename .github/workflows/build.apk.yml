name: Compilar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Leer versión de Gradle
        id: gradle
        run: |
          version=$(sed -n 's/.*gradle-\([0-9.]*\)-.*zip/\1/p' gradle/wrapper/gradle-wrapper.properties)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Compilar APK debug
        run: gradle assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: master-launcher-apk
          path: app/build/outputs/apk/debug/*.apk
